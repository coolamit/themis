# Themis — AI code review on pull requests.
#
# This is the recommended setup (mode 1): same repo PRs are reviewed
# automatically when opened and on every push and ANY PR — including
# fork repo PRs — can be reviewed manually by applying the review label
# (default: themis-review).
#
# The `pull_request_target` trigger never executes fork repo code: Themis
# checks out the trusted base branch and reads the PR head from git
# objects only. See the Security section of the Themis README.

name: Code Review

# One auto review per PR: a new push cancels the stale in-flight review
# of the previous head. Label runs get unique groups on purpose — they
# must never cancel or queue behind anything; Themis itself skips a
# label run when a review of the same head is already in progress.
concurrency:
  group: themis-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  # Lets Themis skip a label run when a review is already in progress;
  # without it that check is skipped (everything else still works).
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: coolamit/themis@latest
        with:
          llm-url: https://openrouter.ai/api/v1
          llm-api-key: ${{ secrets.THEMIS_LLM_API_KEY }}
          llm-model: anthropic/claude-sonnet-5
          # Fail the check when a new finding reaches this severity
          # (off by default — see the Severity gate section of the README):
          # fail-on-severity: high
